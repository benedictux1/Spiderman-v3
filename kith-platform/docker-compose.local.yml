version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=local-dev-secret-key-12345
      - DATABASE_URL=postgresql://kith_user:kith_pass@postgres:5432/kith_db
      - REDIS_URL=redis://redis:6379
      - DEFAULT_ADMIN_USER=admin
      - DEFAULT_ADMIN_PASS=admin123
      - PYTHON_VERSION=3.11.0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: gunicorn --workers 2 --bind 0.0.0.0:5000 wsgi:application --reload
    
  worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=local-dev-secret-key-12345
      - DATABASE_URL=postgresql://kith_user:kith_pass@postgres:5432/kith_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=kith_db
      - POSTGRES_USER=kith_user
      - POSTGRES_PASSWORD=kith_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
