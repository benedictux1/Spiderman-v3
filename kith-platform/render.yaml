services:
  - type: web
    name: kith-platform
    env: python
    branch: ux-improvements
    runtime: python-3.11.0
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DEFAULT_ADMIN_USER
        value: admin
      - key: DEFAULT_ADMIN_PASS
        generateValue: true
    healthCheckPath: /health
    healthCheckTimeout: 300

  - type: worker
    name: kith-celery
    env: python
    branch: ux-improvements
    runtime: python-3.11.0
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app.celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kith-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: kith-redis
          type: redis_internal_url

databases:
  - name: kith-platform-db
    databaseName: kith_platform
    user: kith_user

redis:
  - name: kith-redis
    plan: free
