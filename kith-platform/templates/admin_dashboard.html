<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { background:#ffffff; color:#0f172a; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 16px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:16px; }
    .card { background:#f8fafc; border-radius:12px; padding:16px; border:1px solid #e2e8f0; }
    .metric { font-size: 28px; font-weight: 700; }
    .muted { color:#64748b; }
    canvas { background:#ffffff; border-radius:8px; padding:8px; }
    a.nav { color:#334155; text-decoration:none; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid #e2e8f0; padding:6px 8px; }
    th { color:#475569; font-weight:600; text-transform:uppercase; font-size:12px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    async function fetchJSON(url){
      const res = await fetch(url, { credentials:'include' });
      if(!res.ok){
        const detail = await res.json().catch(()=>null);
        const message = detail && detail.detail ? detail.detail : 'Request failed: '+res.status;
        throw new Error(message);
      }
      return res.json();
    }
    function setText(id, text){ const el=document.getElementById(id); if(el) el.textContent = text; }
    function showError(id, message){ const el=document.getElementById(id); if(el){ el.textContent = message; el.style.display='block'; }}
    function hideError(id){ const el=document.getElementById(id); if(el){ el.textContent=''; el.style.display='none'; }}

    function safeValue(value, fallback='0'){ if(value === null || value === undefined || Number.isNaN(value)) return fallback; return value; }

    function renderTrendsChart(trends){
      const canvas = document.getElementById('trends');
      const ctx = canvas && canvas.getContext('2d');
      if(!ctx) return;
      const labels = trends.map(t => t.execution_date_label || t.execution_date || '');
      const success = trends.map(t => safeValue(t.success_rate, 0));
      const avg = trends.map(t => safeValue(t.avg_execution_time_seconds, 0));
      if(window.trendsChart){ window.trendsChart.destroy(); }
      window.trendsChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets: [
          { label:'Success %', data: success, borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,0.15)', tension:0.3 }
        ]},
        options: { responsive:true, interaction:{mode:'index', intersect:false}, scales:{ y:{ beginAtZero:true, title:{display:true, text:'%' } } } }
      });
      if(window.trendsAvgChart){ window.trendsAvgChart.destroy(); }
      const avgCtx = document.getElementById('trendsAvg')?.getContext('2d');
      if(avgCtx){
        window.trendsAvgChart = new Chart(avgCtx, {
          type: 'bar',
          data: { labels, datasets:[{ label:'Avg Duration (s)', data: avg, backgroundColor:'rgba(16, 185, 129, 0.7)' }] },
          options: { responsive:true, scales:{ y:{ beginAtZero:true } } }
        });
      }
    }

    function renderCategoriesChart(categories){
      const ctx = document.getElementById('categories').getContext('2d');
      if(window.categoriesChart){ window.categoriesChart.destroy(); }
      window.categoriesChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: categories.map(c=>c.category || 'Unknown'),
          datasets: [{ data: categories.map(c=>safeValue(c.success_rate, 0)), backgroundColor: ['#2563eb','#9333ea','#f59e0b','#10b981','#ef4444','#14b8a6'] }]
        },
        options: { responsive:true }
      });
    }

    async function refreshOverview(){
      try{
        const data = await fetchJSON('/api/analytics/dashboard/overview');
        const summary = data.summary || {};
        setText('successRate', `${safeValue(summary.success_rate_24h, '0')}%`);
        setText('failedTests', safeValue(summary.failed_tests_24h, '0'));
        setText('avgTime', `${safeValue(summary.avg_execution_time_seconds, '0')}s`);
        hideError('overviewError');
      }catch(err){
        console.error('overview error', err);
        showError('overviewError', `Failed to load overview: ${err.message}`);
      }
    }

    async function refreshTrends(){
      try{
        const data = await fetchJSON('/api/analytics/dashboard/trends?days=7');
        renderTrendsChart((data.trends)||[]);
        hideError('trendsError');
      }catch(err){
        console.error('trends error', err);
        showError('trendsError', `Failed to load trends: ${err.message}`);
      }
    }

    async function refreshCategories(){
      try{
        const data = await fetchJSON('/api/analytics/dashboard/test-categories');
        renderCategoriesChart((data.categories)||[]);
        hideError('categoriesError');
      }catch(err){
        console.error('categories error', err);
        showError('categoriesError', `Failed to load categories: ${err.message}`);
      }
    }

    async function refreshRuns(){
      try{
        const res = await fetch('/api/analytics/test-runs', { credentials:'include' });
        if(!res.ok){
          const err=await res.json().catch(()=>({}));
          throw new Error(err.detail || (`Request failed: ${res.status}`));
        }
        const data = await res.json();
        const runs = data.runs || [];
        const body = document.getElementById('runsBody');
        body.innerHTML = runs.length ? runs.map(r => `
        <tr>
          <td>${r.id}</td>
            <td style="text-transform:capitalize;">${r.status}</td>
            <td>${r.passed_tests||0}/${r.failed_tests||0}/${r.skipped_tests||0}</td>
            <td>${safeValue(r.execution_time_seconds, 0)}</td>
            <td>${r.started_at || ''}</td>
            <td>${r.failure_reason || ''}</td>
        </tr>
        `).join('') : '<tr><td colspan="6" class="muted" style="padding:8px;">No runs yet.</td></tr>';
        hideError('runsError');
      }catch(err){
        console.error('runs error', err);
        showError('runsError', `Failed to load runs: ${err.message}`);
      }
    }

    async function startRun(){
      const statusEl = document.getElementById('runStatus');
      statusEl.textContent = 'Starting...';
      try{
        const res = await fetch('/api/analytics/test-runs', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify({})
        });
        if(res.status !== 202){
          const err = await res.json().catch(()=>({error:'failed'}));
          console.error('Test run error response:', err);
          
          // Enhanced error display with debugging info
          let errorMsg = `Failed: ${err.detail || err.error || res.status}`;
          if(err.traceback && err.traceback.length > 0) {
            errorMsg += '\n\nDebug info:\n' + err.traceback.join('\n');
          }
          if(err.available_tasks) {
            errorMsg += '\n\nAvailable tasks: ' + err.available_tasks.join(', ');
          }
          if(err.test_tasks) {
            errorMsg += '\n\nTest tasks found: ' + err.test_tasks.join(', ');
          }
          
          statusEl.innerHTML = `<pre style="color: #dc2626; white-space: pre-wrap; font-size: 12px;">${errorMsg}</pre>`;
          return;
        }
        const data = await res.json();
        statusEl.textContent = `Running... task ${data.task_id}`;
        setTimeout(refreshRuns, 2000);
      }catch(err){
        statusEl.textContent = 'Failed to start: '+err.message;
      }
    }

    async function startDiagnostic(){
      const statusEl = document.getElementById('diagnosticStatus');
      statusEl.textContent = 'Starting diagnostic...';
      try{
        const res = await fetch('/api/analytics/diagnose', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify({})
        });
        if(res.status !== 202){
          const err = await res.json().catch(()=>({error:'failed'}));
          console.error('Diagnostic error response:', err);
          statusEl.innerHTML = `<pre style="color: #dc2626; white-space: pre-wrap; font-size: 12px;">Failed: ${err.detail || err.error || res.status}</pre>`;
          return;
        }
        const data = await res.json();
        statusEl.textContent = `Running diagnostic... task ${data.task_id}`;
        setTimeout(refreshRuns, 2000);
      }catch(err){
        statusEl.textContent = 'Failed to start diagnostic: '+err.message;
      }
    }

    async function startDirectDiagnostic(){
      const statusEl = document.getElementById('diagnosticStatus');
      statusEl.textContent = 'Running direct diagnostic...';
      try{
        const res = await fetch('/api/analytics/diagnose-direct', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify({})
        });
        const data = await res.json();
        if(res.status !== 200){
          console.error('Direct diagnostic error:', data);
          statusEl.innerHTML = `<pre style="color: #dc2626; white-space: pre-wrap; font-size: 12px;">Failed: ${data.detail || data.error || res.status}</pre>`;
          return;
        }
        console.log('🔍 DIAGNOSTIC RESULTS:', data.results);
        statusEl.innerHTML = `<span style="color: #16a34a;">✅ Direct diagnostic completed!</span> <a href="#" onclick="console.log(${JSON.stringify(data.results).replace(/"/g, '&quot;')}); return false;" style="color: #2563eb;">View in console</a>`;
        
        // Display key findings
        const results = data.results;
        let summary = `
📊 DIAGNOSTIC SUMMARY:
• Python: ${results.python_info?.version?.split(' ')[0] || 'Unknown'}
• Test files found: ${results.directory_structure?.test_file_count || 0}
• Tests discovered: ${results.test_discovery?.discovered_test_count || 0}
• Import failures: ${Object.values(results.import_tests || {}).filter(t => t.status === 'failed').length}
• Pytest return code: ${results.pytest_execution?.return_code || 'Unknown'}

🔍 Check browser console for full details!`;
        
        console.log(summary);
        
      }catch(err){
        statusEl.textContent = 'Direct diagnostic failed: '+err.message;
        console.error('Direct diagnostic error:', err);
      }
    }

    function init(){
      document.getElementById('runBtn').addEventListener('click', startRun);
      document.getElementById('diagnosticBtn').addEventListener('click', startDiagnostic);
      document.getElementById('directDiagnosticBtn').addEventListener('click', startDirectDiagnostic);
      refreshOverview();
      refreshTrends();
      refreshCategories();
      refreshRuns();
      setInterval(refreshOverview, 30000);
      setInterval(refreshRuns, 10000);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h1>Admin – Dashboard</h1>
      <a class="nav" href="/api/admin/users">← Back to Users</a>
    </div>
    <div id="overviewError" class="muted" style="display:none"></div>
    <div class="grid" style="margin-bottom:16px;">
      <div class="card">
        <div class="muted">Success Rate (24h)</div>
        <div id="successRate" class="metric">–</div>
    </div>
      <div class="card">
        <div class="muted">Failed Tests (24h)</div>
        <div id="failedTests" class="metric">–</div>
    </div>
      <div class="card">
        <div class="muted">Avg Execution Time</div>
        <div id="avgTime" class="metric">–</div>
    </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
        <button id="runBtn" style="background:#2563eb; border:0; color:#fff; border-radius:8px; padding:10px 14px; cursor:pointer;">Run Tests</button>
        <button id="diagnosticBtn" style="background:#dc2626; border:0; color:#fff; border-radius:8px; padding:10px 14px; cursor:pointer;">🔍 Diagnose</button>
        <button id="directDiagnosticBtn" style="background:#16a34a; border:0; color:#fff; border-radius:8px; padding:10px 14px; cursor:pointer;">⚡ Direct Diagnose</button>
        <span id="runStatus" class="muted"></span>
        <span id="runsError" class="muted" style="display:none"></span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="color:#dc2626; font-size:12px;">Diagnostic Status:</span>
        <span id="diagnosticStatus" class="muted" style="font-size:12px;"></span>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="muted">Performance Trends (7d)</div>
        <canvas id="trends" height="160"></canvas>
        <canvas id="trendsAvg" height="160" style="margin-top:12px;"></canvas>
        <span id="trendsError" class="muted" style="display:none"></span>
      </div>
      <div class="card">
        <div class="muted">Test Categories</div>
        <canvas id="categories" height="160"></canvas>
        <span id="categoriesError" class="muted" style="display:none"></span>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="muted" style="margin-bottom:8px;">Recent Test Runs</div>
      <table>
        <thead>
          <tr>
            <th>Run ID</th>
            <th>Status</th>
            <th>Pass/Fail/Skip</th>
            <th>Duration (s)</th>
            <th>Started</th>
            <th>Failure Reason</th>
          </tr>
        </thead>
        <tbody id="runsBody"></tbody>
      </table>
    </div>
  </div>
  <span id="consoleLogAnchor"></span>
</body>
</html>
