<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kith Platform - Simplified Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Simple transition for modal */
        #note-modal {
            transition: opacity 0.2s ease-in-out;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

<!-- Loading state -->
<div id="loading" class="loading">
    <div>Loading...</div>
        </div>
        
<!-- Main app content (hidden until authenticated) -->
<div id="app" class="hidden flex flex-col h-screen">
    <!-- Header & Navigation -->
    <header class="bg-white border-b border-gray-200">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-lg font-semibold text-gray-700 hover:text-blue-600 transition-colors">Contacts</a>
                <a href="/relationship-graph" class="text-gray-500 hover:text-blue-600 transition-colors">Relationship Graph</a>
                <a href="/manage-graph" class="text-gray-500 hover:text-blue-600 transition-colors">Manage Graph</a>
                <a href="/settings" class="text-gray-500 hover:text-blue-600 transition-colors">Settings</a>
                </div>
        </nav>
    </header>

    <!-- Sub-header with Search -->
    <div class="bg-white border-b border-gray-200">
        <div class="container mx-auto px-6 py-4">
             <input type="text" id="search-input" placeholder="Search for contact here" class="w-full px-4 py-3 text-lg border-2 border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>
            
    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-6 py-8">
        <!-- Contacts List View -->
        <div id="contacts-view" class="w-full bg-white rounded-lg border border-gray-200 p-6 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Contacts</h2>
                 <label class="flex items-center space-x-2 text-gray-600">
                    <input type="checkbox" id="tier1-only-checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span>Tier 1 Only</span>
                            </label>
                    </div>

            <!-- Contacts List -->
            <div id="contact-list" class="flex-grow">
                <!-- Contact items will be injected here by JavaScript -->
                        </div>
                        </div>

        <!-- Contact Profile View -->
        <div id="contact-profile-view" class="hidden w-full bg-white rounded-lg border border-gray-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <button id="back-to-contacts" class="text-blue-600 hover:text-blue-800 font-medium flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Back to Contacts
                </button>
                <div class="flex space-x-3">
                    <button id="add-note-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                        Add Note
                    </button>
                    <button id="upload-file-btn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors">
                        Upload PDF
                    </button>
                </div>
            </div>
            
            <h1 id="contact-profile-name" class="text-2xl font-bold mb-6 text-gray-800"></h1>
            
            <div id="contact-profile-content" class="space-y-4">
                <!-- Contact categories will be loaded here -->
            </div>
        </div>
    </main>
                    </div>

<!-- Add Note Modal -->
<div id="note-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 z-50">
    <div id="modal-content" class="bg-white rounded-lg shadow-xl p-8 w-full max-w-lg relative">
        <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <h3 id="modal-contact-name" class="text-2xl font-bold mb-4">Add Note</h3>
        <textarea id="modal-notes-textarea" placeholder="Type your notes here..." class="w-full h-48 px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none"></textarea>
        <div class="mt-6 flex justify-end">
            <button id="analyze-note-btn" class="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform active:scale-95">
                Analyze Note
            </button>
        </div>
    </div>
</div>

<!-- File Upload Modal -->
<div id="file-upload-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-lg relative">
        <button id="close-upload-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <h3 id="upload-modal-contact-name" class="text-2xl font-bold mb-4">Upload File</h3>
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
            <input type="file" id="file-input" class="hidden" accept=".pdf,.doc,.docx,.txt">
            <div id="file-drop-zone" class="cursor-pointer">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p class="mt-2 text-sm text-gray-600">Click to upload or drag and drop</p>
                <p class="text-xs text-gray-500">PDF, DOC, DOCX, TXT files only</p>
            </div>
        </div>
        <div class="mt-6 flex justify-end space-x-3">
            <button id="cancel-upload-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                Cancel
            </button>
            <button id="upload-file-submit-btn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition-colors" disabled>
                Upload File
            </button>
        </div>
    </div>
</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded, showing app...');
            // Since we're using server-side authentication, just show the app
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            initializeApp();
        });

function initializeApp() {
    // Real contacts data from database
    let contacts = [];
    let activeContactId = null;
    let currentContactData = null;

    // DOM Elements
    const contactListEl = document.getElementById('contact-list');
    const searchInput = document.getElementById('search-input');
    const tier1Checkbox = document.getElementById('tier1-only-checkbox');
    
    // View Elements
    const contactsView = document.getElementById('contacts-view');
    const contactProfileView = document.getElementById('contact-profile-view');
    const backToContactsBtn = document.getElementById('back-to-contacts');
    const contactProfileName = document.getElementById('contact-profile-name');
    const contactProfileContent = document.getElementById('contact-profile-content');
    
    // Modal DOM Elements
    const noteModal = document.getElementById('note-modal');
    const modalContactName = document.getElementById('modal-contact-name');
    const modalNotesTextarea = document.getElementById('modal-notes-textarea');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const analyzeNoteBtn = document.getElementById('analyze-note-btn');
    const addNoteBtn = document.getElementById('add-note-btn');
    
    // File Upload Modal Elements
    const fileUploadModal = document.getElementById('file-upload-modal');
    const uploadModalContactName = document.getElementById('upload-modal-contact-name');
    const closeUploadModalBtn = document.getElementById('close-upload-modal-btn');
    const uploadFileBtn = document.getElementById('upload-file-btn');
    const fileInput = document.getElementById('file-input');
    const fileDropZone = document.getElementById('file-drop-zone');
    const uploadFileSubmitBtn = document.getElementById('upload-file-submit-btn');
    const cancelUploadBtn = document.getElementById('cancel-upload-btn');

    // 20 Categories in order
    const CATEGORY_ORDER = [
        "Actionable", "Goals", "Relationship strategy", "Social", "Wellbeing",
        "Avocation", "Professional background", "Environment and lifestyle", 
        "Psychology and values", "Communication style", "Challenges and development",
        "Deeper insights", "Financial situation", "Admin matters", 
        "Established patterns", "Core identity", "Information gaps", 
        "Memory anchors", "Positionality", "Others"
    ];

    // Fetch contacts from database
    async function loadContacts() {
        try {
            const response = await fetch('/api/contacts');
            const data = await response.json();
            if (data.success) {
                contacts = data.contacts.map(contact => ({
                    id: contact.id,
                    name: contact.full_name,
                    tier: contact.tier,
                    notes: contact.notes,
                    interaction_count: contact.interaction_count,
                    last_interaction: contact.last_interaction
                }));
                renderContacts();
            } else {
                console.error('Failed to load contacts:', data.error);
            }
        } catch (error) {
            console.error('Error loading contacts:', error);
            // Fallback to empty array if API fails
            contacts = [];
            renderContacts();
        }
    }

    // Load contact profile data
    async function loadContactProfile(contactId) {
        try {
            const response = await fetch(`/api/contact/${contactId}`);
            const data = await response.json();
            if (response.ok) {
                currentContactData = data;
                renderContactProfile(data);
                showContactProfile();
            } else {
                console.error('Failed to load contact profile:', data.error);
                alert('Failed to load contact profile');
            }
        } catch (error) {
            console.error('Error loading contact profile:', error);
            alert('Error loading contact profile');
        }
    }

    // Render contacts list
    const renderContacts = () => {
        const searchTerm = searchInput.value.toLowerCase();
        const tier1Only = tier1Checkbox.checked;

        const filteredContacts = contacts.filter(contact => {
            const nameMatch = contact.name.toLowerCase().includes(searchTerm);
            const tierMatch = !tier1Only || contact.tier === 1;
            return nameMatch && tierMatch;
        });

        contactListEl.innerHTML = ''; // Clear existing list

        if (filteredContacts.length === 0) {
             contactListEl.innerHTML = `<div class="text-center text-gray-500 py-4">No contacts found.</div>`;
                return;
            }
            
        // Create a grid layout
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';

        filteredContacts.forEach(contact => {
            const tierIcon = contact.tier === 1 
                ? `<span class="text-yellow-500" title="Tier 1">⭐</span>` 
                : `<span class="text-gray-500" title="Tier 2">👥</span>`;
            
            const item = document.createElement('div');
            item.className = 'flex items-center space-x-3 p-4 rounded-lg cursor-pointer transition-colors border hover:bg-gray-100 hover:border-blue-400';
            item.dataset.contactId = contact.id;
            
            item.innerHTML = `
                ${tierIcon}
                <span class="font-medium text-gray-700">${contact.name}</span>
            `;
            
            item.addEventListener('click', () => {
                activeContactId = contact.id;
                loadContactProfile(contact.id);
            });
            grid.appendChild(item);
        });
        contactListEl.appendChild(grid);
    };

    // Render contact profile with 20 categories
    function renderContactProfile(profileData) {
        const { contact_info: info, categorized_data: categories } = profileData || {};
        
        // Set contact name
        contactProfileName.textContent = info?.full_name || 'Unknown Contact';
        
        // Clear existing content
        contactProfileContent.innerHTML = '';
        
        // Add contact meta info
        const metaDiv = document.createElement('div');
        metaDiv.className = 'bg-gray-50 rounded-lg p-4 mb-6';
        metaDiv.innerHTML = `
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div><strong>Tier:</strong> ${info?.tier || 'N/A'}</div>
                <div><strong>Telegram:</strong> @${info?.telegram_username || info?.telegram_handle || 'N/A'}</div>
            </div>
        `;
        contactProfileContent.appendChild(metaDiv);

        // Create categories grid
        const categoriesGrid = document.createElement('div');
        categoriesGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

        // Render all 20 categories
        CATEGORY_ORDER.forEach(category => {
            const categoryData = categories?.[category] || [];
            const items = Array.isArray(categoryData) ? categoryData : [categoryData].filter(Boolean);
            
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'bg-white border border-gray-200 rounded-lg p-4';
            categoryDiv.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-semibold text-gray-800">${category}</h3>
                    <span class="text-xs text-gray-500">${items.length} item${items.length !== 1 ? 's' : ''}</span>
                </div>
                <div class="space-y-2">
                    ${items.length > 0 
                        ? items.map(item => `<div class="text-sm text-gray-700 bg-gray-50 p-2 rounded">${item}</div>`).join('')
                        : '<div class="text-sm text-gray-500 italic">No information available</div>'
                    }
                </div>
            `;
            categoriesGrid.appendChild(categoryDiv);
        });

        contactProfileContent.appendChild(categoriesGrid);
    }

    // Show contact profile view
    function showContactProfile() {
        contactsView.classList.add('hidden');
        contactProfileView.classList.remove('hidden');
    }

    // Show contacts list view
    function showContactsList() {
        contactProfileView.classList.add('hidden');
        contactsView.classList.remove('hidden');
        activeContactId = null;
        currentContactData = null;
    }

    // Modal functions
    const openNoteModal = () => {
        if (activeContactId === null) return;
        const contact = contacts.find(c => c.id === activeContactId) || 
                       (currentContactData ? { name: currentContactData.contact_info.full_name } : null);
        if (!contact) return;
        
        modalContactName.textContent = `Add Note for ${contact.name}`;
        modalNotesTextarea.value = '';
        noteModal.classList.remove('hidden');
        noteModal.classList.add('flex');
    };

    const closeNoteModal = () => {
        noteModal.classList.add('hidden');
        noteModal.classList.remove('flex');
    };

    const openFileUploadModal = () => {
        if (activeContactId === null) return;
        const contact = contacts.find(c => c.id === activeContactId) || 
                       (currentContactData ? { name: currentContactData.contact_info.full_name } : null);
        if (!contact) return;
        
        uploadModalContactName.textContent = `Upload File for ${contact.name}`;
        fileInput.value = '';
        uploadFileSubmitBtn.disabled = true;
        fileUploadModal.classList.remove('hidden');
        fileUploadModal.classList.add('flex');
    };

    const closeFileUploadModal = () => {
        fileUploadModal.classList.add('hidden');
        fileUploadModal.classList.remove('flex');
    };

    // Handle note analysis
    async function analyzeNote() {
        const noteText = modalNotesTextarea.value.trim();
        if (!noteText || !activeContactId) return;

        try {
            analyzeNoteBtn.disabled = true;
            analyzeNoteBtn.textContent = 'Analyzing...';

            const response = await fetch('/api/process-note', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    contact_id: activeContactId,
                    note: noteText
                })
            });

            const result = await response.json();
            if (response.ok) {
                closeNoteModal();
                // Reload the contact profile to show updated data
                await loadContactProfile(activeContactId);
                alert('Note analyzed and processed successfully!');
            } else {
                alert('Failed to analyze note: ' + (result.error || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error analyzing note:', error);
            alert('Error analyzing note');
        } finally {
            analyzeNoteBtn.disabled = false;
            analyzeNoteBtn.textContent = 'Analyze Note';
        }
    }

    // Handle file upload
    async function handleFileUpload() {
        const file = fileInput.files[0];
        if (!file || !activeContactId) return;

        try {
            uploadFileSubmitBtn.disabled = true;
            uploadFileSubmitBtn.textContent = 'Uploading...';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('contact_id', activeContactId);

            const response = await fetch('/api/files/upload', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            if (response.ok) {
                closeFileUploadModal();
                alert('File uploaded successfully! It will be processed in the background.');
            } else {
                alert('Failed to upload file: ' + (result.error || 'Unknown error'));
            }
        } catch (error) {
            console.error('Error uploading file:', error);
            alert('Error uploading file');
        } finally {
            uploadFileSubmitBtn.disabled = false;
            uploadFileSubmitBtn.textContent = 'Upload File';
        }
    }

    // Event Listeners
    searchInput.addEventListener('input', renderContacts);
    tier1Checkbox.addEventListener('change', renderContacts);
    backToContactsBtn.addEventListener('click', showContactsList);
    
    // Note modal events
    addNoteBtn.addEventListener('click', openNoteModal);
    closeModalBtn.addEventListener('click', closeNoteModal);
    analyzeNoteBtn.addEventListener('click', analyzeNote);
    noteModal.addEventListener('click', (event) => {
        if (event.target === noteModal) closeNoteModal();
    });

    // File upload modal events
    uploadFileBtn.addEventListener('click', openFileUploadModal);
    closeUploadModalBtn.addEventListener('click', closeFileUploadModal);
    cancelUploadBtn.addEventListener('click', closeFileUploadModal);
    uploadFileSubmitBtn.addEventListener('click', handleFileUpload);
    fileUploadModal.addEventListener('click', (event) => {
        if (event.target === fileUploadModal) closeFileUploadModal();
    });

    // File input events
    fileDropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            uploadFileSubmitBtn.disabled = false;
            fileDropZone.innerHTML = `
                <div class="text-center">
                    <p class="text-sm font-medium text-gray-900">${file.name}</p>
                    <p class="text-xs text-gray-500">${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                </div>
            `;
        }
    });

    // Drag and drop for file upload
    fileDropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileDropZone.classList.add('border-blue-400', 'bg-blue-50');
    });

    fileDropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        fileDropZone.classList.remove('border-blue-400', 'bg-blue-50');
    });

    fileDropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        fileDropZone.classList.remove('border-blue-400', 'bg-blue-50');
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            fileInput.files = files;
            const event = new Event('change');
            fileInput.dispatchEvent(event);
        }
    });

    // Initial load from database
    loadContacts();
}
    </script>
    
</body>
</html>
