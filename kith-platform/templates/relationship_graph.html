<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship Graph - Kith Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

<!-- Loading state -->
<div id="loading" class="flex justify-center items-center h-screen text-lg text-gray-600">
    <div>Loading...</div>
</div>

<!-- Main app content (hidden until authenticated) -->
<div id="app" class="hidden flex flex-col h-screen">
    <!-- Header & Navigation -->
    <header class="bg-white border-b border-gray-200">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-gray-500 hover:text-blue-600 transition-colors">Contacts</a>
                <a href="/relationship-graph" class="text-lg font-semibold text-gray-700 hover:text-blue-600 transition-colors">Relationship Graph</a>
                <a href="/manage-graph" class="text-gray-500 hover:text-blue-600 transition-colors">Manage Graph</a>
                <a href="/settings" class="text-gray-500 hover:text-blue-600 transition-colors">Settings</a>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-6 py-8">
        <div class="w-full bg-white rounded-lg border border-gray-200 p-6">
            <h1 class="text-2xl font-bold mb-6">Relationship Graph</h1>
            <div class="text-center py-12">
                <div class="text-gray-500 text-lg mb-4">📊</div>
                <h2 class="text-xl font-semibold text-gray-700 mb-2">Visualize Your Network</h2>
                <p class="text-gray-500 mb-6">See how your contacts are connected and discover relationship patterns.</p>
                <div class="bg-gray-100 rounded-lg p-8">
                    <p class="text-gray-600">Graph visualization will be implemented here</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Since we're using server-side authentication, just show the app
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
});
</script>

</body>
</html>
